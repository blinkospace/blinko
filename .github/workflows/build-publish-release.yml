name: Build and Push Release Docker Image

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && format('Docker Released - v{0}', github.event.inputs.version) ||
    github.event_name == 'release' && format('Docker Released - {0}', github.event.release.tag_name) ||
    'Docker Released'
  }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: ''
      trigger_app_release:
        description: 'Trigger app release simultaneously'
        type: boolean
        default: true
      set_latest:
        description: 'Set Docker image as latest tag'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-version:
    if: github.event_name == 'workflow_dispatch'
    name: Verify Project Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git User
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Get Version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.version }}" != "" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          fi
          echo "Trigger app version release: ${{ env.VERSION }}"
          echo "Version value: ${{ env.VERSION }}"

      - name: Verify package.json Version
        run: |
          test "$(jq -r '.version' package.json)" = "$VERSION"

  build:
    needs: update-version
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} Image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.version }}" != "" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          fi
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: |
          git pull origin ${{ github.ref_name }}

      - name: Verify package.json version
        run: |
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          echo "Package.json version: $PACKAGE_VERSION"
          echo "Expected version: ${{ env.VERSION }}"
          if [ "$PACKAGE_VERSION" != "${{ env.VERSION }}" ]; then
            echo "::error::Package.json version ($PACKAGE_VERSION) does not match expected version (${{ env.VERSION }})"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            blinkospace/blinko
            ghcr.io/blinkospace/blinko
          tags: |
            type=raw,value=${{ env.VERSION }}
          flavor: |
            latest=${{ github.event_name != 'workflow_dispatch' || github.event.inputs.set_latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}

      - name: Build and export
        id: build
        uses: docker/build-push-action@v5
        with:
          platforms: ${{ matrix.platform }}
          context: ./
          file: dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ github.workflow }}-${{ matrix.platform }},mode=max
          outputs: type=image,"name=blinkospace/blinko,ghcr.io/blinkospace/blinko",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and Push Multi-Architecture Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: |
          git pull origin ${{ github.ref_name }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Extract version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.version }}" != "" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            blinkospace/blinko
            ghcr.io/blinkospace/blinko
          tags: |
            type=raw,value=${{ env.VERSION }}
          flavor: |
            latest=${{ github.event_name != 'workflow_dispatch' || github.event.inputs.set_latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          mapfile -t docker_tags < <(jq -r '.tags[] | select(startswith("blinkospace/blinko:"))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t ghcr_tags < <(jq -r '.tags[] | select(startswith("ghcr.io/blinkospace/blinko:"))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker_args=(); for tag in "${docker_tags[@]}"; do docker_args+=(-t "$tag"); done
          ghcr_args=(); for tag in "${ghcr_tags[@]}"; do ghcr_args+=(-t "$tag"); done
          docker_sources=(); ghcr_sources=()
          for digest in *; do
            docker_sources+=("blinkospace/blinko@sha256:$digest")
            ghcr_sources+=("ghcr.io/blinkospace/blinko@sha256:$digest")
          done
          docker buildx imagetools create "${docker_args[@]}" "${docker_sources[@]}"
          docker buildx imagetools create "${ghcr_args[@]}" "${ghcr_sources[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect blinkospace/blinko:${{ env.VERSION }}
          docker buildx imagetools inspect ghcr.io/blinkospace/blinko:${{ env.VERSION }}

  trigger-app-release:
    name: Trigger App Build Release
    needs: update-version
    # Only run when manually triggered and app release trigger option selected
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_app_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get Version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          fi
          echo "Trigger app version release: ${{ env.VERSION }}"

      - name: Trigger App Release Workflow
        id: dispatch
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-app-release
          client-payload: |
            {
              "tag": "${{ env.VERSION }}",
              "version": "${{ env.VERSION }}",
              "sha": "${{ github.sha }}"
            }
        continue-on-error: true

      - name: Check Dispatch Result
        if: steps.dispatch.outcome == 'failure'
        run: |
          echo "::warning::Failed to trigger app release workflow. This might be due to permission issues."
          echo "::warning::Please ensure the GITHUB_TOKEN has 'workflow' permission enabled in repository settings."
          echo "::warning::Alternatively, you can manually trigger the app-release workflow with version: ${{ env.VERSION }}"

  promote-published:
    name: Promote verified version to latest
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote existing multi-architecture images without rebuilding
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          for image in blinkospace/blinko ghcr.io/blinkospace/blinko; do
            digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$image:$VERSION" | jq -r '.digest')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker buildx imagetools create -t "$image:latest" "$image@$digest"
            docker buildx imagetools inspect "$image:latest"
          done
